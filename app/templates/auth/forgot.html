<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — MyCTF</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head><body>
<div class="auth-wrap"><div class="auth-card card">
  <div class="brand"><div class="logo">M</div>
    <div><b>MyCTF</b><span>Learn·Exploit·Capture</span></div></div>
  <h1 style="text-align:center;margin:.2em 0">Reset your password</h1>
  <p class="muted small" style="text-align:center">Enter your email and we'll send a reset link.</p>
  <form method="post" action="{{ url_for('auth.forgot_password') }}">
    <label>Email</label>
    <input name="email" type="email" required autofocus>
    <button class="btn" style="width:100%;margin-top:16px" type="submit">Send reset link</button>
  </form>
  <div style="text-align:center;margin-top:14px">
    <a class="muted small" href="{{ url_for('auth.login_page') }}">Back to sign in</a>
  </div>
</div></div>
</body></html>
