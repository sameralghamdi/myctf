<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — MyCTF</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head><body>
<div class="auth-wrap"><div class="auth-card card">
  <div class="brand"><div class="logo">M</div>
    <div><b>MyCTF</b><span>Learn·Exploit·Capture</span></div></div>
  <h1 style="text-align:center;margin:.2em 0">Create account</h1>
  {% for e in errors %}<div class="alert err">{{ e }}</div>{% endfor %}
  <form method="post" action="{{ url_for('auth.register') }}">
    <label>Username</label>
    <input name="username" value="{{ form.get('username','') }}" required
           pattern="[A-Za-z0-9_.-]{3,32}">
    <label>Email</label>
    <input name="email" type="email" value="{{ form.get('email','') }}" required>
    <label>Password</label>
    <input name="password" type="password" required minlength="10">
    <div class="muted tiny" style="margin-top:4px">At least 10 chars, mixing upper, lower, digits and symbols.</div>
    <button class="btn" style="width:100%;margin-top:16px" type="submit">Create account</button>
  </form>
  <div style="text-align:center;margin-top:14px">
    <a class="muted small" href="{{ url_for('auth.login_page') }}">Already have an account? Sign in</a>
  </div>
</div></div>
</body></html>
