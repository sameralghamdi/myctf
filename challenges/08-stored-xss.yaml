slug: stored-xss
name: Notice Board
category: web
difficulty: medium
lab_kind: stored_xss
dynamic_flag: true
est_minutes: 25
sort: 8
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: Post a comment containing HTML like <b>hi</b> and view the page source.
- level: 2
  cost: 0
  body: The page defines myctfSolve(). Store a comment that calls it, then open /admin.
- level: 3
  cost: 0
  body: Post <img src=x onerror=myctfSolve()> then visit the moderator review (/admin).
remediation: 'Escape on output, sanitise stored HTML with an allow-list, and set a strict Content-Security-Policy
  so inline script cannot run.

  '
walkthrough: 'Comments are rendered unescaped. Storing <img src=x onerror=myctfSolve()> means that when
  the moderator views comments, the payload executes; the server-side checker recognises the executing
  payload and reveals the flag.

  '
