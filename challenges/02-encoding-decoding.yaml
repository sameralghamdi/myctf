slug: encoding-decoding
name: Lost Message
category: crypto
difficulty: very_easy
lab_kind: encoding
dynamic_flag: true
est_minutes: 10
sort: 2
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: The blob is text-safe and ends with '=' padding — a classic sign of one layer.
- level: 2
  cost: 0
  body: Base64-decode first. The result is letters shifted by a fixed amount.
- level: 3
  cost: 0
  body: After Base64, apply ROT13 to the result to reveal the flag.
remediation: 'Never use encoding (Base64/hex) to protect secrets. Use authenticated encryption (e.g. AES-GCM)
  with keys managed outside the application.

  '
walkthrough: 'Base64-decode the blob, then ROT13 the output. The decoder bench on the lab page does both;
  "Use output as input" lets you chain them.

  '
