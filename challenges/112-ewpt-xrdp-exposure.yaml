slug: ewpt-xrdp-exposure
name: XRDP Exposure (EWPT)
category: network
difficulty: easy
lab_kind: static
flag: FLAG{xrdp_exposed_weak_password}
est_minutes: 15
sort: 112
description: |-
  Nmap shows `3389/tcp open ms-wbt-server xrdp` on `xrdp.lab.local`. The challenge file contains weak credentials.

  **Objective:** Connect via RDP and read the flag on the desktop.

  **Exam topics:** Port 3389; ms-wbt-server; xrdp; service enumeration.

  _Isolated lab only (`*.lab.local` or your own Docker/VMs). Never expose these vulnerable services to the internet._
objectives:
- Identify RDP/xrdp from a port scan
- Connect with an RDP client
- Find the flag on the remote desktop
hints:
- level: 1
  cost: 0
  body: Use xfreerdp or Remmina.
- level: 2
  cost: 5
  body: The account is ctf, and the password is the same as the username.
- level: 3
  cost: 10
  body: Check the desktop for flag.txt.
remediation: Restrict RDP/xrdp to a VPN, enforce MFA, use strong passwords.
walkthrough: xfreerdp /v:xrdp.lab.local /u:ctf /p:ctf, then open flag.txt on the desktop.
references:
- title: Nmap service detection
  url: https://nmap.org/book/man-version-detection.html
