slug: ewpt-stack-fingerprint
name: 'Stack Fingerprint: Flask/Werkzeug (EWPT)'
category: web
difficulty: easy
lab_kind: static
flag: FLAG{python_flask_werkzeug_debug_route}
est_minutes: 15
sort: 106
description: |-
  `http://flask.lab.local` returns `Server: Werkzeug httpd 0.14.1 (Python 3.8.17)`. A backup file is publicly accessible.

  **Objective:** Identify the server-side language and framework, find the backup source file, and recover the flag route.

  **Exam topics:** Server-side language detection; Flask/Werkzeug; Python 3.8.17; version disclosure.

  _Isolated lab only (`*.lab.local` or your own Docker/VMs). Never expose these vulnerable services to the internet._
objectives:
- Fingerprint a framework from banners
- Use robots.txt to find hidden paths
- Read leaked source to find a hidden route
hints:
- level: 1
  cost: 0
  body: Check robots.txt.
- level: 2
  cost: 5
  body: Look for a backup copy of the application source.
- level: 3
  cost: 10
  body: Read the source for a hidden route and the header it expects.
remediation: Hide version banners, remove backups from the web root, disable debug routes.
walkthrough: 'robots.txt disallows /backup/app.py. The source contains /flag, which requires the header
  X-Debug: 1. curl -H ''X-Debug: 1'' http://flask.lab.local/flag returns the flag.'
references:
- title: OWASP WSTG - Fingerprint Web Server
  url: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/02-Fingerprint_Web_Server
