slug: jwt-authorization-flaw
name: Visitor Pass
category: web
difficulty: medium
lab_kind: jwt_flaw
dynamic_flag: true
est_minutes: 25
sort: 11
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: A JWT is header.payload.signature, each Base64url. Decode the payload.
- level: 2
  cost: 10
  body: The verifier honours the header's alg. What if alg is "none"?
- level: 3
  cost: 20
  body: Build header {"alg":"none"} . payload {"role":"admin"} . (empty signature) and send it to /admin.
remediation: 'Never trust the token''s alg header. Pin the algorithm server-side, reject "none", and verify
  signatures with a vetted library and a strong key.

  '
walkthrough: 'Re-encode the token with header {"alg":"none"} and payload {"role":"admin"}, and an empty
  signature. The flawed verifier accepts it without checking a signature, granting admin and revealing
  the flag.

  '
