slug: ewpt-fuzz-the-login
name: Reception
category: web
difficulty: easy
lab_kind: ewpt_101
est_minutes: 15
sort: 101
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: Use ffuf -u http://target.lab.local/api/login -X POST -d "username=FUZZ&password=test" -w sqli-payloads.txt
    -mc 200.
- level: 2
  cost: 5
  body: Fuzz username with an SQL injection payload list.
- level: 3
  cost: 10
  body: Look for a different response length or status than the 401s.
remediation: Parameterized queries, input validation, generic login errors, rate limiting.
walkthrough: Fuzz username with sqli-payloads.txt. Replay the successful SQL payload using curl -c cookies.txt,
  then curl -b cookies.txt http://target.lab.local/admin.
dynamic_flag: true
