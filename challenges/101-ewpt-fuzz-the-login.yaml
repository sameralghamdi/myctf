slug: ewpt-fuzz-the-login
name: Reception
category: web
difficulty: easy
lab_kind: ewpt_101
est_minutes: 15
sort: 101
description: |-
  You have permission to investigate this isolated environment. Explore what is available and recover the flag.

  Scope: target.lab.local
hints:
- level: 1
  cost: 0
  body: "The login passes what you type straight to a database. A list of unusual inputs fed in automatically can reveal the one that behaves differently."
- level: 2
  cost: 0
  body: "Compare responses, not just success: size and status often betray the odd one out."
remediation: Parameterized queries, input validation, generic login errors, rate limiting.
walkthrough: Fuzz username with sqli-payloads.txt. Replay the successful SQL payload using curl -c cookies.txt,
  then curl -b cookies.txt http://target.lab.local/admin.
dynamic_flag: true
