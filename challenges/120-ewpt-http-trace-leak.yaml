slug: ewpt-http-trace-leak
name: HTTP TRACE / Method Information Leak (EWPT)
category: web
difficulty: easy
lab_kind: static
flag: FLAG{trace_method_enabled}
est_minutes: 10
sort: 120
description: |-
  `http://trace.lab.local` responds differently to TRACE. The flag is reflected in the TRACE response body.

  **Objective:** Use OPTIONS and TRACE to discover and retrieve the flag.

  **Exam topics:** Test HTTP methods; configuration and deployment management; information disclosure.

  _Isolated lab only (`*.lab.local` or your own Docker/VMs). Never expose these vulnerable services to the internet._
objectives:
- Enumerate methods with OPTIONS
- Send a TRACE request with a custom header
- Read the reflected request in the response body
hints:
- level: 1
  cost: 0
  body: Send OPTIONS /.
- level: 2
  cost: 5
  body: If TRACE is listed, send TRACE /.
- level: 3
  cost: 10
  body: Inspect the response body.
remediation: Disable TRACE; harden web server methods.
walkthrough: 'curl -X OPTIONS http://trace.lab.local/ lists TRACE. curl -X TRACE http://trace.lab.local/
  -H ''X-Test: flag'' reflects the flag in the body.'
references:
- title: OWASP WSTG - Test HTTP Methods
  url: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/06-Test_HTTP_Methods
