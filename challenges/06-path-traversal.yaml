slug: path-traversal
name: Paper Trail
category: web
difficulty: easy
lab_kind: path_traversal
dynamic_flag: true
est_minutes: 15
sort: 6
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: The viewer opens a file from a folder, using the name you give it. Does it care where that name leads?
- level: 2
  cost: 0
  body: File names can describe a location relative to where you are, including going back up. The flag is a plain text file sitting just outside the documents folder.
remediation: 'Canonicalise the resolved path and verify it stays within the intended root (realpath +
  prefix check), or avoid filesystem paths entirely by mapping an allow-list of ids to known files.

  '
walkthrough: 'The viewer does normpath(join(''docs'', file)). Supplying ../flag.txt resolves to
  flag.txt, outside docs/, revealing the flag.

  '
