slug: ewpt-backup-file-leak
name: Archive Room
category: web
difficulty: easy
lab_kind: ewpt_114
est_minutes: 15
sort: 114
description: |-
  You have permission to investigate this isolated environment. Explore what is available and recover the flag.

  Scope: target.lab.local
hints:
- level: 1
  cost: 0
  body: "ffuf with wordlist.txt can find old archives. Think about the names a developer would use for a site backup."
- level: 2
  cost: 0
  body: "Download it with curl -O <url> (keeps the file's name) or curl -o <name> <url>; wget works too."
- level: 3
  cost: 0
  body: "Unpack it with unzip, then look through everything, including hidden files (ls -a)."
remediation: Remove backups from the web root; deny dotfiles and archives; add deploy pipeline checks.
walkthrough: curl -O http://target.lab.local/www.zip downloads the virtual archive. Run unzip www.zip,
  then ls -a www, cat www/.env, and cat www/flag.txt. Each command is entered separately.
dynamic_flag: true
