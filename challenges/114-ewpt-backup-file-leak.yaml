slug: ewpt-backup-file-leak
name: Backup File Configuration Leak (EWPT)
category: web
difficulty: easy
lab_kind: ewpt_114
est_minutes: 15
sort: 114
description: '`http://backup.lab.local` has a public backup archive of the site. The archive contains
  a `.env` file and a flag file.


  **Objective:** Find the backup archive, extract it, and read the flag.


  **Exam topics:** OWASP WSTG Configuration and Deployment Management Testing; backup files; directory
  enumeration.


  **Terminal lab:** Click Start Lab and read `README.txt`. Targets and tools run in the same simulated
  browser terminal as the other terminal challenges; no external machines or DNS setup are needed. Type
  `help` for available commands. Flags are unique to your lab session and use `MYCTF{...}`.'
objectives:
- Fuzz for common backup file names
- Extract an archive and search it
- Recognise secrets in configuration files
hints:
- level: 1
  cost: 0
  body: Fuzz for www.zip, backup.zip, and .git.
- level: 2
  cost: 5
  body: Download with curl -O http://backup.lab.local/www.zip, then unzip www.zip. Inspect ls -a www and
    cat www/flag.txt.
remediation: Remove backups from the web root; deny dotfiles and archives; add deploy pipeline checks.
walkthrough: curl -O http://backup.lab.local/www.zip downloads the virtual archive. Run unzip www.zip,
  then ls -a www, cat www/.env, and cat www/flag.txt. Each command is entered separately.
references:
- title: OWASP WSTG - Review Old Backup and Unreferenced Files
  url: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
dynamic_flag: true
