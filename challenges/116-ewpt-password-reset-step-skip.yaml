slug: ewpt-password-reset-step-skip
name: Password Reset Step Skip (EWPT)
category: web
difficulty: medium
lab_kind: static
flag: FLAG{password_reset_step_skip}
est_minutes: 25
sort: 116
description: |-
  The password reset flow on the lab app has three steps: request token, verify token, set password. Step 2 can be skipped.

  **Objective:** Reset the admin password by directly calling step 3 with the admin email, then log in and read the flag.

  **Exam topics:** Business Logic Testing; workflow/state flaws; step skipping.

  _Isolated lab only (`*.lab.local` or your own Docker/VMs). Never expose these vulnerable services to the internet._
objectives:
- Map a multi-step workflow
- Skip a step and replay the final request
- Recognise missing server-side state tracking
hints:
- level: 1
  cost: 0
  body: Capture all three requests.
- level: 2
  cost: 5
  body: Try sending step 3 without a valid token.
- level: 3
  cost: 10
  body: Check whether the server tracks reset state.
remediation: Server-side state machine; signed one-time tokens; verify step order.
walkthrough: Request a reset for admin@lab.local. POST directly to /reset/step3 with a new password. Log
  in as admin to read the flag.
references:
- title: OWASP WSTG - Test for Process Timing / Business Logic
  url: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/10-Business_Logic_Testing/
