slug: ewpt-password-reset-step-skip
name: Password Reset Step Skip (EWPT)
category: web
difficulty: medium
lab_kind: ewpt_116
est_minutes: 25
sort: 116
description: 'The password reset flow at `http://reset.lab.local` has three steps: request token, verify
  token, set password. Step 2 can be skipped.


  **Objective:** Reset the admin password by directly calling step 3 with the admin email, then log in
  and read the flag.


  **Exam topics:** Business Logic Testing; workflow/state flaws; step skipping.


  **Terminal lab:** Click Start Lab and read `README.txt`. Targets and tools run in the same simulated
  browser terminal as the other terminal challenges; no external machines or DNS setup are needed. Type
  `help` for available commands. Flags are unique to your lab session and use `MYCTF{...}`.'
objectives:
- Map a multi-step workflow
- Skip a step and replay the final request
- Recognise missing server-side state tracking
hints:
- level: 1
  cost: 0
  body: Capture all three requests.
- level: 2
  cost: 5
  body: Try sending step 3 without a valid token.
- level: 3
  cost: 10
  body: Check whether the server tracks reset state.
remediation: Server-side state machine; signed one-time tokens; verify step order.
walkthrough: Inspect curl http://reset.lab.local/. POST /reset/step3 with email=admin@lab.local&password=NewPass123.
  POST the same credentials to /api/login with curl -c cookies.txt, then curl -b cookies.txt http://reset.lab.local/admin.
references:
- title: OWASP WSTG - Test for Process Timing / Business Logic
  url: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/10-Business_Logic_Testing/
dynamic_flag: true
