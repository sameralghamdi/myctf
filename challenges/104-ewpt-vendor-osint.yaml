description: 'A public company profile says: "NexusTech develops custom web applications for clients."
  The page source contains a hidden comment listing additional services. One option is the correct additional
  service.


  **Objective:** Find the hidden service in the page source or public profile (`http://osint.lab.local/nexustech.html`)
  and run `answer <service_name_with_underscores>` in the terminal to receive your session flag.


  **Exam topics:** NexusTech additional service question: Maintenance and Support.


  **Terminal lab:** Click Start Lab and read `README.txt`. Targets and tools run in the same simulated
  browser terminal as the other terminal challenges; no external machines or DNS setup are needed. Type
  `help` for available commands. Flags are unique to your lab session and use `MYCTF{...}`.'
objectives:
- Read page source for HTML comments
- Check for JSON-LD or other embedded metadata
hints:
- level: 1
  cost: 0
  body: View the page source.
- level: 2
  cost: 5
  body: Look for HTML comments or JSON-LD.
- level: 3
  cost: 10
  body: The correct service is the one most commonly offered alongside custom development.
remediation: OSINT awareness; remove sensitive comments from production pages.
walkthrough: Inspect http://osint.lab.local/nexustech.html and find the comment listing the services.
  The additional service offered with custom development is maintenance and support. Run answer maintenance_and_support
  to receive your session flag.
