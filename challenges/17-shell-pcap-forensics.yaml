slug: shell-pcap-forensics
name: Outbound
category: forensics
difficulty: medium
lab_kind: shell_pcap_forensics
dynamic_flag: true
est_minutes: 20
sort: 17
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: '`cat case-notes.txt` first. Then `tshark -r evidence/capture.pcap` shows every packet.'
- level: 2
  cost: 10
  body: 'Filter with `-Y http`: one POST request carries a `data=` value. That is the stolen, encoded
    text.'
- level: 3
  cost: 15
  body: The key is the FTP password (`-Y ftp`). Run `./decode.py <data> <key>`.
remediation: 'FTP sends passwords in cleartext: replace it with SFTP. Do not reuse passwords as encryption
  keys, and remember XOR with a short repeating key is encoding, not encryption. Egress filtering and
  DLP would have blocked the upload.

  '
walkthrough: 'tshark -r evidence/capture.pcap -Y ftp shows PASS k4li-r0cks. -Y http shows a POST to /upload.php
  with data=<base64>. ./decode.py <base64> k4li-r0cks prints the flag.

  '
