description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: The login form builds a database query out of what you type. What happens if your input contains characters that mean something to the database?
remediation: 'Use parameterised queries / prepared statements so input is always treated as data, never
  as SQL. Apply least-privilege DB accounts and add a WAF as defence-in-depth. Never surface raw SQL errors
  to users.

  '
walkthrough: 'The backend runs:  SELECT * FROM users WHERE username=''<u>'' AND password=''<p>''. Submitting
  username  '' OR ''1''=''1'' --   turns the WHERE clause always-true and comments out the password check,
  returning the first row (admin), whose secret_note holds the flag.

  '
