slug: idor-profile-access
name: Private Accounts
category: web
difficulty: easy
lab_kind: idor_bank
dynamic_flag: true
est_minutes: 15
sort: 5
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: Look closely at the number in the API address. Is it tied to who you are?
- level: 2
  cost: 0
  body: The portal trusts the address you ask for. Other accounts exist besides yours.
- level: 3
  cost: 0
  body: Account numbers are handed out in order. Think about which neighbours of your own number might hold something more interesting, and what the server checks before answering.
remediation: 'Enforce object-level authorization on every request: verify the authenticated principal
  owns (or may access) the requested object before returning it. Use unguessable ids only as defence-in-depth,
  never as the access control itself.

  '
walkthrough: 'The portal page loads account 1001 via the API. Changing the id to 1002 returns the Corporate
  Treasury account because the endpoint does no ownership check; its note field contains the flag.

  '
