slug: ewpt-nginx-alias-traversal
name: Side Entrance
category: web
difficulty: medium
lab_kind: ewpt_109
est_minutes: 20
sort: 109
description: |-
  You have permission to investigate this isolated environment. Explore what is available and recover the flag.

  Goal: the site serves files from /static/. The flag is in flag.txt, next to that folder rather than inside it. See whether the path handling lets you step outside.

  Scope: target.lab.local
hints:
- level: 1
  cost: 0
  body: "Compare how the server answers /static/ with how it answers paths that continue right after the name /static."
- level: 2
  cost: 0
  body: "A path mapping with a missing trailing slash can be stretched: try adding two dots directly after the folder name, with no slash between, and then the flag file name."
remediation: Avoid an ambiguous alias; use root where possible; normalize paths.
walkthrough: curl --path-as-is "http://target.lab.local/static../flag.txt" returns the flag.
dynamic_flag: true
