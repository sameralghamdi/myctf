slug: reflected-xss
name: Echo Chamber
category: web
difficulty: easy
lab_kind: reflected_xss
dynamic_flag: true
est_minutes: 20
sort: 4
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: Whatever you search for is shown back on the page. Does the page treat your text as plain text, or as something the browser might act on?
remediation: 'Contextually escape all output (HTML-encode by default), prefer templating that auto-escapes,
  and deploy a strict Content-Security-Policy that forbids inline script so a reflection cannot execute.

  '
walkthrough: 'The q parameter is reflected verbatim. Any payload that executes script — for example <img
  src=x onerror=alert(1)> or <script>alert(1)</script> — makes the server-side checker return the flag.

  '
