slug: ewpt-fastapi-docs-leak
name: FastAPI Docs Leak (EWPT)
category: api
category_name: API Security
skill: API Security
difficulty: medium
lab_kind: static
flag: FLAG{fastapi_openapi_docs_leak}
est_minutes: 20
sort: 105
description: |-
  `http://api.lab.local:8000/` returns `{"info":"Visit the /docs endpoint for the OpenAPI UI"}`. The Server header is `uvicorn`. The API documentation is exposed in production.

  **Objective:** Inspect the OpenAPI schema, find a hidden admin endpoint, and retrieve the flag.

  **Exam topics:** Server-side language detection; FastAPI/uvicorn; OpenAPI UI; the /docs endpoint.

  _Isolated lab only (`*.lab.local` or your own Docker/VMs). Never expose these vulnerable services to the internet._
objectives:
- Fingerprint the stack from response headers
- Read an exposed OpenAPI schema
- Call an undocumented admin endpoint with the right header
hints:
- level: 1
  cost: 0
  body: Visit /docs.
- level: 2
  cost: 5
  body: Fetch /openapi.json.
- level: 3
  cost: 10
  body: Look for an admin flag endpoint under /api/v1/.
- level: 4
  cost: 10
  body: Check the required request headers.
remediation: Disable /docs and /openapi.json in production or protect them; require authentication.
walkthrough: 'curl http://api.lab.local:8000/openapi.json reveals /api/v1/admin/flag, which requires X-Admin:
  true. curl -H ''X-Admin: true'' http://api.lab.local:8000/api/v1/admin/flag returns the flag.'
references:
- title: OWASP API Security Top 10
  url: https://owasp.org/API-Security/
