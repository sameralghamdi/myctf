description: |-
  You have permission to investigate this isolated environment. Explore what is available and recover the flag.

  Scope: target.lab.local
hints:
- level: 1
  cost: 0
  body: "Frameworks often publish their own documentation. Is it still reachable?"
- level: 2
  cost: 0
  body: "A machine-readable description of every route may exist; look for ones not meant for you."
- level: 3
  cost: 0
  body: "Restricted routes usually expect something extra in the request."
remediation: Disable /docs and /openapi.json in production or protect them; require authentication.
walkthrough: 'curl http://target.lab.local/openapi.json reveals /api/v1/admin/flag, which requires
  X-Admin: true. curl -H ''X-Admin: true'' http://target.lab.local/api/v1/admin/flag returns the
  flag.'
