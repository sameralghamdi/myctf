slug: weak-password-reset
name: Weak Password Reset
category: web
difficulty: medium
lab_kind: weak_reset
dynamic_flag: true
est_minutes: 20
sort: 10
description: >
  AccountCenter issues password-reset tokens as sequential integers. Observe the
  token issued for your own account, predict the one issued for the victim, and
  take over their account to reveal the flag.
objectives:
  - Analyse how reset tokens are generated
  - Spot predictable, non-random tokens
  - Chain a self-service reset into an account takeover
hints:
  - level: 1
    cost: 0
    body: Request a reset for the guest account and note the token value.
  - level: 2
    cost: 10
    body: Tokens are sequential. Request guest, then victim — what is victim's token?
  - level: 3
    cost: 20
    body: "Request guest (token N), request victim, then reset victim with token N+1."
remediation: >
  Use long, high-entropy, single-use, expiring tokens from a CSPRNG, bound to the
  account. Never use sequential or otherwise predictable values.
walkthrough: >
  Requesting a reset for guest reveals the current counter value. The next request
  (for victim) increments it by one, so the victim's token is predictable; using
  it resets the victim's password and reveals the flag.
references:
  - title: OWASP — Forgot Password Cheat Sheet
    url: https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
  - title: CWE-640 Weak Password Recovery
    url: https://cwe.mitre.org/data/definitions/640.html
