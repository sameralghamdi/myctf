description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: "A reset relies on a secret value. Look at what yours looks like, and compare more than one."
- level: 2
  cost: 0
  body: "If the value follows a pattern, it can be predicted. Whose reset would you like to take over?"
remediation: 'Use long, high-entropy, single-use, expiring tokens from a CSPRNG, bound to the account.
  Never use sequential or otherwise predictable values.

  '
walkthrough: 'Requesting a reset for guest reveals the current counter value. The next request (for victim)
  increments it by one, so the victim''s token is predictable; using it resets the victim''s password
  and reveals the flag.

  '
