slug: shell-web-recon
name: Internal Affairs
category: web
difficulty: easy
lab_kind: shell_web_recon
dynamic_flag: true
est_minutes: 15
sort: 16
description: You have permission to investigate this isolated environment. Explore what is available and
  recover the flag.
hints:
- level: 1
  cost: 0
  body: "Read the briefing first, then look at what the website says about itself, including the parts a visitor does not see."
- level: 2
  cost: 0
  body: "Sites list places they would rather search engines skip. Some contain forgotten copies."
- level: 3
  cost: 0
  body: "Credentials found in a leftover file may open a protected area."
remediation: 'Never leave backup or config copies inside the web root, and do not rely on robots.txt to
  hide anything: it is a public list of the paths you care about. Rotate any credential that was ever
  stored in a served file.

  '
walkthrough: 'curl /robots.txt reveals /backup/ and /admin/. curl /backup/ lists config.php.bak; fetching
  it shows the admin credentials. curl -u admin:<password> http://10.10.10.5/admin/ returns the flag.

  '
